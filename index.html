<style>
* {
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html, body {
    width:100%;
    min-height:100%;
}

body {
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
    background:

    linear-gradient(145deg,#050505,#111111,#050505);
    font-family:Arial, sans-serif;
    color:#fff;
}

.container {
    width:100%;
    max-width:390px;
    margin:auto;
}

.card {
    width:100%;
    padding:32px 22px 25px;
    text-align:center;
    border:1px solid rgba(232,190,91,.32);
    border-radius:23px;
    background:rgba(255,255,255,.055);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    box-shadow:0 15px 50px rgba(0,0,0,.55);
}

.logo {
    width:82px;
    height:82px;
    margin:0 auto 17px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    border:2px solid #d9ad50;
    background:linear-gradient(145deg,#29200d,#090909);
    box-shadow:0 0 25px rgba(226,179,76,.25);
    color:#f5d58c;
    font-size:27px;
    font-weight:900;
    letter-spacing:1px;
}

h1 {
    font-size:27px;
    font-weight:800;
    letter-spacing:1px;
    color:#f5d58c;
    margin-bottom:9px;
}

.subtitle {
    font-size:13px;
    color:#bcbcbc;
    line-height:1.5;
    margin-bottom:21px;
}

.line {
    width:55px;
    height:2px;
    margin:0 auto 21px;
    background:#d7ac54;
    border-radius:10px;
}

.info {
    padding:13px 10px;
    border-radius:12px;
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.08);
    margin-bottom:20px;
    font-size:13px;
    color:#e4e4e4;
}

.join-btn {
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:9px;
    padding:16px 12px;
    border-radius:12px;
    text-decoration:none;
    color:#090909;
    font-size:16px;
    font-weight:900;
    letter-spacing:.5px;
    background:linear-gradient(100deg,#d6a642,#ffe5a1,#d6a642);
    box-shadow:0 0 12px rgba(245,195,83,.45),
               0 0 28px rgba(245,195,83,.22);
    animation:glow 2s infinite alternate;
    transition:.2s;
}

.join-btn:active {
    transform:scale(.97);
}

@keyframes glow {
    from {
        box-shadow:0 0 10px rgba(245,195,83,.35);
    }
    to {
        box-shadow:0 0 25px rgba(245,195,83,.75),
                   0 0 40px rgba(245,195,83,.25);

</main>
</div>

<script>
document.getElementById('joinButton').addEventListener('click', function(e) {

    e.preventDefault();

    const telegramLink = this.href;

    // Subscribe event on join button click
    if (typeof fbq === 'function') {
        fbq('track', 'Subscribe');
    }

    // Allow pixel event to enter the browser queue
    setTimeout(function() {
        window.location.href = telegramLink;
    }, 500);

});
</script>
